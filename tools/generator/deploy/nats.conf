# NATS for the generator: one server, JetStream on disk, a token required.
# Reachable only on the compose network; the monitoring port only inside its
# own container (the healthcheck).

server_name: notecom-nats
listen: 0.0.0.0:4222
http: 127.0.0.1:8222

authorization {
  token: $NATS_TOKEN
}

# An outbox message is a few hundred bytes.
max_payload: 64KB

jetstream {
  store_dir: /data
  max_memory_store: 8MB
  max_file_store: 256MB
}
