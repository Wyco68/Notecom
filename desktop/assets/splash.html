<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Notecom</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #0a0e14;
    color: #d1d5db;
    font-family: -apple-system, "Segoe UI", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
    -webkit-user-select: none;
  }
  .panel {
    text-align: center;
  }
  .title {
    font-size: 20px;
    font-weight: 600;
    color: #e5e7eb;
    margin-bottom: 14px;
  }
  .stage {
    font-size: 13px;
    color: #9ca3af;
  }
  .mark {
    width: 56px;
    height: 56px;
    margin: 0 auto 18px;
    display: block;
  }
  .spinner {
    width: 22px;
    height: 22px;
    margin: 0 auto 16px;
    border: 2px solid rgba(255, 255, 255, 0.1);
    border-top-color: #3b82f6;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
</style>
</head>
<body>
  <div class="panel">
    <svg class="mark" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <rect width="512" height="512" rx="112" fill="#2563eb" />
      <path d="M148 88 H292 L372 168 V352 a28 28 0 0 1 -28 28 H148 a28 28 0 0 1 -28 -28 V116 a28 28 0 0 1 28 -28 Z" fill="#ffffff" />
      <path d="M292 88 L372 168 H292 Z" fill="#93c5fd" />
      <g fill="#2563eb">
        <rect x="160" y="212" width="172" height="24" rx="12" />
        <rect x="160" y="268" width="112" height="24" rx="12" />
        <rect x="160" y="324" width="80" height="24" rx="12" />
      </g>
      <g stroke="#ffffff" stroke-width="24" fill="none" stroke-linecap="round">
        <line x1="392" y1="392" x2="436" y2="436" />
        <circle cx="352" cy="352" r="64" fill="#1d4ed8" />
      </g>
    </svg>
    <div class="spinner"></div>
    <div class="title">Notecom</div>
    <div class="stage" id="stage">Starting...</div>
  </div>
  <script>
    window.__TAURI__.event.listen("stage-update", (event) => {
      document.getElementById("stage").textContent = event.payload;
    });
  </script>
</body>
</html>
