# Self-hosted deployment for a VPS. Plain `docker compose up -d --build` on any
# host — no PaaS, no externally-created networks.
#
# One service. The app reads and writes Supabase directly, so there is no local
# database to run, no vault volume to persist and no sidecars to keep in step —
# a VPS, a laptop in development and the desktop app all see the same rows the
# moment they change. (Until now this file also ran vaultd, indexd and stored,
# a Go trio that owned a local SQLite copy and synced it up in the background.)
#
# Because the container holds no state, redeploying is `up -d --build` and
# nothing else: there is nothing to back up here, and nothing to lose.
#
# Config comes from a .env alongside this file:
#   SUPABASE_URL / SUPABASE_ANON_KEY   the project this instance reads and writes
#   WEB_PORT                           host port for the web UI (default 8080)
#
# The web build uses BuildKit cache mounts (npm cache, .next/cache), so the
# first build is slow and every later one is far quicker. Keep them warm: never
# build with --no-cache, and don't run `docker builder prune` casually. Also
# worth exporting BUILDX_NO_DEFAULT_ATTESTATIONS=1 to skip the provenance and
# SBOM manifests — they add ~15s per image and nothing here consumes them.

name: notecom

services:
  web:
    build:
      context: .
      # NEXT_PUBLIC_* are inlined into the client bundle during `npm run
      # build`, so they must be build args as well as run-time env.
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
    environment:
      # Every query runs as the signed-in user; there is no service-role key in
      # this stack. The anon key is publishable by design — it reaches the
      # browser, and Row Level Security is what protects the data.
      NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_URL:-}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
    # Published on the host so plain `docker compose up` works on any VPS.
    # WEB_PORT defaults to 8080; set it to 3000 (or bind 127.0.0.1 only) to
    # taste. Fronting this with an existing reverse proxy that lives on its own
    # Docker network? Add docker-compose.proxy.yml (see that file) instead of
    # editing this one.
    ports:
      - "${WEB_PORT:-8080}:3000"
    restart: unless-stopped
