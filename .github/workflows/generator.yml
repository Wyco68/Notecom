# The Go generator (tools/generator): tests on every change that could affect
# it, and on main an image pushed to GHCR. Deploying is optional and off until
# the repository variable GENERATOR_DEPLOY is "true" and the VPS secrets exist
# (see tools/generator/README.md); otherwise run deploy.sh on the box.

name: Generator

on:
  push:
    branches: [main]
    paths:
      - "tools/generator/**"
      - "supabase/migrations/**"
      - "docs/teaching-guidelines.md"
      - "docs/html-output-contract.md"
      - "docs/lesson-template.md"
      - "docs/quiz-guidelines.md"
      - "lib/generate/validate.ts"
      - "lib/search/chunker.ts"
      - "lib/vault/slug.ts"
      - "lib/vault/media-src.ts"
      - ".github/workflows/generator.yml"
  pull_request:
    branches: [main]
    paths:
      - "tools/generator/**"
      - "supabase/migrations/**"
      - "lib/generate/validate.ts"
      - "lib/search/chunker.ts"
      - "lib/vault/slug.ts"
      - "lib/vault/media-src.ts"
      - ".github/workflows/generator.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tools/generator
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/generator/go.mod
          cache-dependency-path: tools/generator/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # The Go contract checker and chunker must agree with the app's
      # TypeScript: regenerate the fixtures from it and fail on any change.
      - name: Parity fixtures are current
        run: |
          node testdata/parity.mjs
          git diff --exit-code -- testdata/parity.json

      - name: Vet
        run: go vet ./... && go vet -tags integration ./internal/it/

      - name: Unit tests
        run: go test -race ./...

      - name: Integration tests (Postgres + NATS in Docker)
        run: scripts/it.sh -race

  image:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      tag: sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        id: name
        run: echo "repo=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/notecom-generator" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: tools/generator/Dockerfile
          push: true
          provenance: false
          tags: |
            ${{ steps.name.outputs.repo }}:sha-${{ github.sha }}
            ${{ steps.name.outputs.repo }}:latest
          cache-from: type=gha,scope=generator
          cache-to: type=gha,scope=generator,mode=max

  deploy:
    needs: image
    if: vars.GENERATOR_DEPLOY == 'true'
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Deploy on the VPS
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_USER: ${{ secrets.VPS_USER }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          TAG: ${{ needs.image.outputs.tag }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_deploy "$SSH_USER@$SSH_HOST" "cd ~/server/apps/notecom-generator && ./deploy.sh '$TAG'"
