# Builds the desktop installers for Windows, macOS (Apple Silicon + Intel),
# and Linux, then attaches them to a GitHub Release. Tauri installers can't
# be cross-compiled, so each OS is built on its own native runner.
#
# How to cut a release (non-technical steps in docs/INSTALL.md):
#   1. Bump "version" in desktop/tauri.conf.json (and package.json).
#   2. git tag v0.1.1 && git push origin v0.1.1
#   3. This workflow builds every installer and uploads them to a DRAFT
#      release named after the tag. Open the release on GitHub and click
#      "Publish" when you're happy with it.
# You can also run it by hand from the Actions tab (workflow_dispatch).

name: Release installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write # required for tauri-action to create/upload the release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest # Windows x64 -> .exe (NSIS) + .msi
          - platform: macos-latest # macOS Apple Silicon (arm64) -> .dmg
          - platform: macos-13 # macOS Intel (x64) -> .dmg
          - platform: ubuntu-22.04 # Linux x64 -> .AppImage + .deb
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      # WebKitGTK + build tooling Tauri needs on Linux (Windows/macOS ship
      # their webview and toolchain).
      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            patchelf \
            build-essential

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./desktop -> target"

      - name: Install npm dependencies
        run: npm ci

      # tauri-action runs `tauri build` (which fires prepare-desktop-resources.mjs
      # to build vaultd + indexd + the Next standalone bundle), collects each
      # platform's installer, and uploads them to the release for this tag.
      - name: Build and upload installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}
          releaseName: Notes ${{ github.ref_type == 'tag' && github.ref_name || '(manual build)' }}
          releaseBody: "Download the installer for your operating system below and double-click it to install. See docs/INSTALL.md for help and optional AI setup."
          releaseDraft: true
          prerelease: false
          args: --config desktop/tauri.conf.json
