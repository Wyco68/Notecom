# Fast compatibility check on every push/PR to main. Does NOT build the
# installers (that's release.yml, which is heavy and runs on tags) — it just
# confirms the web app type-checks, so a change that breaks the build is
# caught before you cut a release.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install npm dependencies
        run: npm ci

      - name: Type-check web app
        run: npx tsc --noEmit
